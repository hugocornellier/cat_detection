name: cat_detection
description: "Cat face and landmark detection using on-device LiteRT (formerly TensorFlow Lite) models."
version: 4.1.1
repository: https://github.com/hugocornellier/cat_detection

topics:
  - litert
  - tflite
  - cat-detection
  - computer-vision
  - on-device-ml

environment:
  sdk: ">=3.10.0 <4.0.0"
  # flutter_test in Flutter 3.44 and earlier pins meta 1.18.0, which cannot
  # coexist with dartcv4 2.3.1 (meta ^1.19.0). 3.47.5 is the validated floor.
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  animal_detection: ^4.1.2
  opencv_dart: ^2.2.2
  # Direct constraint so resolution can never fall back to a dartcv4 whose iOS
  # CMake hook hardcodes a 12.0 deployment target (rejected by Xcode 27).
  # No Dart source imports it; it is a compatibility floor only.
  dartcv4: ^2.3.1
  # dartcv4 2.3.1's link hook uses the hooks 2.x LinkInput API but still
  # declares hooks >=1.0.0, so a lockfile holding hooks 1.x fails every
  # profile and release build. Same compatibility-floor role as dartcv4.
  hooks: ^2.0.0
  flutter_litert: ^3.9.2
  http: ^1.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/models/cat_face_localizer.tflite
    - assets/models/cat_face_landmarks_full.tflite
    - assets/models/species_mapping.json

  plugin:
    platforms:
      ios:
        dartPluginClass: CatDetectionDart
      android:
        dartPluginClass: CatDetectionDart
      macos:
        dartPluginClass: CatDetectionDart
      windows:
        pluginClass: CatDetectionPlugin
      linux:
        pluginClass: CatDetectionPlugin
