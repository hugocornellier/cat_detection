name: cat_detection
description: "Cat face and landmark detection using on-device LiteRT (formerly TensorFlow Lite) models."
version: 2.0.0
repository: https://github.com/hugocornellier/cat_detection

topics:
  - litert
  - tflite
  - cat-detection
  - computer-vision
  - on-device-ml

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  animal_detection: ^2.0.0
  opencv_dart: ^2.2.1+4
  flutter_litert: ^3.7.0
  meta: ^1.17.0
  http: ^1.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/models/cat_face_localizer.tflite
    - assets/models/cat_face_landmarks_full.tflite

  plugin:
    platforms:
      ios:
        dartPluginClass: CatDetectionDart
      android:
        dartPluginClass: CatDetectionDart
      macos:
        dartPluginClass: CatDetectionDart
      windows:
        pluginClass: CatDetectionPlugin
      linux:
        pluginClass: CatDetectionPlugin
